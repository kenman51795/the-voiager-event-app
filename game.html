<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f38">
  <title>The Voiager — Play</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="game">
  <main class="game-shell">
    <header class="game-header">
      <a class="icon-button back" href="index.html" aria-label="Back to decks">←</a>
      <div class="journey-pill">
        <div class="journey-meta">
          <span id="deck-name">The Voiager</span>
          <label>
            <span class="sr-only">Choose a phase</span>
            <select id="phase-selector"></select>
          </label>
        </div>
        <span class="pill-divider" aria-hidden="true"></span>
        <div class="progress" aria-label="Card progress">
          <span id="card-counter">1 / 65</span>
          <span class="progress-track"><span id="progress-fill"></span></span>
        </div>
      </div>
    </header>

    <section class="card-stage" aria-live="polite">
      <button class="card-button" id="next-card" aria-label="Show next card">
        <img id="card" src="" alt="Conversation prompt">
        <span class="tap-hint">Tap for the next card</span>
      </button>
    </section>

    <nav class="control-dock" aria-label="Game controls">
      <button id="prev-card" type="button"><span aria-hidden="true">←</span><small>Previous</small></button>
      <button id="shuffle-button" type="button"><span aria-hidden="true">⤨</span><small>Shuffle</small></button>
      <button id="timer-toggle" type="button"><span id="timer-icon" aria-hidden="true">◷</span><small id="timer-display">Timer</small></button>
      <button id="reset-button" type="button"><span aria-hidden="true">↻</span><small>Restart</small></button>
    </nav>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
